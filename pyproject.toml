[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pale"
version = "0.0.1"
description = "Framework-agnostic checkpoint deduplication and delta storage engine"
requires-python = ">=3.10"

[project.optional-dependencies]
benchmark = [
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "xgboost>=1.5",
    "torch>=2.0",
    "torchvision>=0.15",
    "zstandard>=0.21",
    "blake3>=0.3",
    "pandas>=1.3",
    "tqdm>=4.60",
    "pytest>=7.0",
]
